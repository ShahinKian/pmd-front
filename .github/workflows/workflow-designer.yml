name: Workflow designer validation
on:
  pull_request:
    branches:
      - feature/expert-workflow-designer
  push:
    branches:
      - fix/workflow-action-catalog-ui

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
